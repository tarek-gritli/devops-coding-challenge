services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: dev
      MYSQL_DATABASE: challenge
    container_name: crewmeister-mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pdev"]
      interval: 5s
      retries: 20
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    build: .
    ports:
      - "8080:8080"
    container_name: crewmeister-app
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/challenge
      SPRING_DATASOURCE_WRITER_URL: jdbc:mysql://mysql:3306/challenge
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: dev
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
