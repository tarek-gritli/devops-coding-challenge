name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dev
          MYSQL_DATABASE: challenge
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pdev"
          --health-interval 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # The app's default datasource (root/dev on localhost:3306) matches the service above
      - run: ./mvnw -B verify

  helm:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: helm lint charts/crewmeister
      # Also render with monitoring on, so the optional templates are checked too
      - run: helm template ci charts/crewmeister --set serviceMonitor.enabled=true > /dev/null

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
        working-directory: terraform
      - run: terraform init -backend=false
        working-directory: terraform/envs/kind
      - run: terraform validate
        working-directory: terraform/envs/kind

  scan-repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Secrets + misconfigurations in the Dockerfile, Helm chart and Terraform.
      # pom.xml is skipped: Trivy would resolve it against Maven Central, which rate-limits (429).
      # Dependencies are covered by the image scan instead.
      - name: Trivy repo scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,misconfig
          severity: HIGH,CRITICAL
          skip-files: pom.xml
          version: v0.76.0
          output: trivy-repo.txt
      - name: Show repo scan results
        run: |
          { echo '### Trivy repo scan'; echo '```'; cat trivy-repo.txt 2>/dev/null || echo 'scan produced no output'; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

  image:
    needs: [test, helm, terraform]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      # Pull requests only build the image, pushes to main also publish it
      PUBLISH: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build into the local Docker daemon first so the image can be scanned before it is published
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Report-only, see scan-repo. Reads the exact jars from inside the image, no Maven Central needed.
      # The action caches Trivy's database by itself (it is ~1.5 GB).
      - name: Trivy image scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          timeout: 20m
          version: v0.76.0
          output: trivy-image.txt
      - name: Show image scan results
        run: |
          { echo '### Trivy image scan'; echo '```'; cat trivy-image.txt 2>/dev/null || echo 'scan produced no output'; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        if: env.PUBLISH == 'true'
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
