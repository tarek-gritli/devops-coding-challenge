{{- if .Values.serviceMonitor.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cm.name" . }}-dashboard
  labels:
    grafana_dashboard: "1"
    {{- include "cm.labels" . | nindent 4 }}
data:
  crewmeister.json: |-
    {{- .Files.Get "dashboards/crewmeister.json" | nindent 4 }}
{{- end }}
