{{- $name := printf "%s-db" (include "cm.name" .) }}
{{- $pw := .Values.externalDatabase.password }}
{{- if .Values.mysql.enabled }}
{{- $pw = .Values.mysql.rootPassword }}
{{- if not $pw }}
{{- /* keep the generated password stable across upgrades */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- if and $existing $existing.data }}
{{- $pw = index $existing.data "password" | b64dec }}
{{- else }}
{{- $pw = randAlphaNum 24 }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "cm.labels" . | nindent 4 }}
stringData:
  username: {{ if .Values.mysql.enabled }}root{{ else }}{{ .Values.externalDatabase.username }}{{ end }}
  password: {{ $pw | quote }}
