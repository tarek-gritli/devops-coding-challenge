replicaCount: 2

image:
  repository: ghcr.io/tarek-gritli/devops-coding-challenge
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests: { cpu: 100m, memory: 384Mi }
  limits: { memory: 768Mi }

# Bundled single-instance MySQL (official image). Disable and set
# externalDatabase.* to use a managed DB (Cloud SQL / Azure DB for MySQL).
mysql:
  enabled: true
  image: mysql:8.4
  database: challenge
  rootPassword: ""   # empty -> random value generated once, kept across upgrades
  storage: 1Gi

externalDatabase:
  host: ""
  port: 3306
  database: challenge
  username: root
  password: ""

ingress:
  enabled: false
  className: nginx
  host: crewmeister.local

# Also installs the Grafana dashboard and alert rules.
# Requires the Prometheus Operator CRDs (kube-prometheus-stack)
serviceMonitor:
  enabled: false
  interval: 15s
